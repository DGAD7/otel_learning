receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317
      http:
        endpoint: localhost:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 20
    spike_limit_percentage: 5
  resourcedetection:
    detectors: [system]
    system:
      hostname_sources: [os]

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection]
      exporters: [debug]
